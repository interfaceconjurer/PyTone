[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peachpy"
version = "0.1.0"
description = "PeachPy: turn images into ASCII art as plain text, colored terminal output, HTML or SVG."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.scripts]
peachpy = "peachpy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
