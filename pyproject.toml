[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peachpy"
version = "0.1.0"
description = "PeachPy: turn images into ASCII art as plain text, colored terminal output, HTML or SVG."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["Pillow>=13.0"]

[project.scripts]
peachpy = "peachpy.cli:entrypoint"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["peachpy"]

[tool.hatch.build.targets.sdist]
include = ["/peachpy", "/tests", "/README.md", "/pyproject.toml", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
